{% extends "base.html" %}
{% block content %}
<div class="tui-panel narrow">
    <div class="panel-title c-cyan">┌─[ {{ t('edit_profile') }} ]─┐</div>
    <form method="POST" class="tui-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>{{ t('display_name') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="text" name="display_name" value="{{ user.display_name or '' }}"
                   maxlength="100" class="tui-input">
        </div>
        <label>{{ t('bio') }}</label>
        <textarea name="bio" rows="5" maxlength="1000" class="tui-input">{{ user.bio or '' }}</textarea>
        <label>{{ t('github') }} URL</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="url" name="github_url" value="{{ user.github_url or '' }}"
                   class="tui-input" placeholder="https://github.com/...">
        </div>
        <label>{{ t('avatar') }} URL</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="url" name="avatar_url" value="{{ user.avatar_url or '' }}"
                   class="tui-input" placeholder="https://...">
        </div>
        <div class="form-actions">
            <button type="submit" class="tui-btn accent big">[ {{ t('save') }} ]</button>
            <a href="{{ url_for('profile', username=user.username) }}" class="tui-btn">[ {{ t('cancel') }} ]</a>
        </div>
    </form>
</div>
{% endblock %}
