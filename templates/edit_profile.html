{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>Редактировать профиль</h1>
</div>

<form method="POST" class="form">
    <div class="form-group">
        <label for="display_name">{{ t('display_name') }}:</label>
        <input type="text" id="display_name" name="display_name" value="{{ user.display_name }}" 
               class="form-control">
    </div>
    
    <div class="form-group">
        <label for="bio">{{ t('bio') }}:</label>
        <textarea id="bio" name="bio" rows="5" class="form-control">{{ user.bio }}</textarea>
    </div>
    
    <div class="form-group">
        <label for="github_url">{{ t('github') }} URL:</label>
        <input type="url" id="github_url" name="github_url" value="{{ user.github_url }}" 
               class="form-control" placeholder="https://github.com/username">
    </div>
    
    <button type="submit" class="btn btn-primary">Сохранить</button>
    <a href="{{ url_for('profile', username=user.username) }}" class="btn btn-outline">Отмена</a>
</form>
{% endblock %}
