{% extends "base.html" %}
{% block content %}
<div class="tui-panel narrow">
    <div class="panel-title c-cyan">┌─[ {{ t('login') }} ]─┐</div>
    <form method="POST" class="tui-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
        <label>{{ t('username') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="text" name="username" required autofocus class="tui-input">
        </div>
        <label>{{ t('password') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="password" name="password" required class="tui-input">
        </div>
        <button type="submit" class="tui-btn accent big">[ {{ t('execute') }} ]</button>
    </form>
    <div class="dim center">
        {{ t('no_account') }} <a href="{{ url_for('register') }}" class="c-cyan">[ {{ t('register') }} ]</a>
    </div>
</div>
{% endblock %}
