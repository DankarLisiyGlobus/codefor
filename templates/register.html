{% extends "base.html" %}

{% block content %}
<div class="auth-container">
    <h1>{{ t('register') }}</h1>
    
    <form method="POST" class="form auth-form">
        <div class="form-group">
            <label for="username">{{ t('username') }}:</label>
            <input type="text" id="username" name="username" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="email">{{ t('email') }}:</label>
            <input type="email" id="email" name="email" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="display_name">{{ t('display_name') }}:</label>
            <input type="text" id="display_name" name="display_name" class="form-control">
        </div>
        
        <div class="form-group">
            <label for="password">Пароль:</label>
            <input type="password" id="password" name="password" required class="form-control">
        </div>
        
        <div class="form-group">
            <label for="bio">{{ t('bio') }}:</label>
            <textarea id="bio" name="bio" rows="3" class="form-control"></textarea>
        </div>
        
        <div class="form-group">
            <label for="github_url">{{ t('github') }} URL:</label>
            <input type="url" id="github_url" name="github_url" class="form-control" 
                   placeholder="https://github.com/username">
        </div>
        
        <button type="submit" class="btn btn-primary btn-lg">{{ t('register') }}</button>
    </form>
    
    <p class="auth-link">Уже есть аккаунт? <a href="{{ url_for('login') }}">{{ t('login') }}</a></p>
</div>
{% endblock %}
