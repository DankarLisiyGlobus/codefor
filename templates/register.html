{% extends "base.html" %}
{% block content %}
<div class="tui-panel narrow">
    <div class="panel-title c-cyan">┌─[ {{ t('register') }} ]─┐</div>
    <form method="POST" class="tui-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label>{{ t('username') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="text" name="username" required maxlength="80" class="tui-input">
        </div>
        <label>{{ t('email') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="email" name="email" required maxlength="120" class="tui-input">
        </div>
        <label>{{ t('display_name') }}</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="text" name="display_name" maxlength="100" class="tui-input">
        </div>
        <label>{{ t('password') }} (min 8)</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="password" name="password" required minlength="8" class="tui-input">
        </div>
        <label>{{ t('bio') }}</label>
        <textarea name="bio" rows="3" maxlength="1000" class="tui-input"></textarea>
        <label>{{ t('github') }} URL</label>
        <div class="input-line"><span class="prompt c-green">></span>
            <input type="url" name="github_url" placeholder="https://github.com/..." class="tui-input">
        </div>
        <button type="submit" class="tui-btn accent big">[ {{ t('create') }} ]</button>
    </form>
    <div class="dim center">
        {{ t('have_account') }} <a href="{{ url_for('login') }}" class="c-cyan">[ {{ t('login') }} ]</a>
    </div>
</div>
{% endblock %}
