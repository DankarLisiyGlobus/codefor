{% extends "base.html" %}

{% block content %}
<div class="page-header">
    <h1>{{ t('new_post') }}</h1>
</div>

<form method="POST" enctype="multipart/form-data" class="form">
    <div class="form-group">
        <label for="title">{{ t('title') }}:</label>
        <input type="text" id="title" name="title" required class="form-control" maxlength="200">
    </div>
    
    <div class="form-group">
        <label for="content">{{ t('content') }} (HTML):</label>
        <textarea id="content" name="content" rows="15" required class="form-control" 
                  placeholder="<p>Ваш текст здесь...</p>"></textarea>
        <small>Поддерживается HTML форматирование</small>
    </div>
    
    <div class="form-group">
        <label for="attachments">Прикрепить файлы:</label>
        <input type="file" id="attachments" name="attachments" multiple class="form-control">
        <small>Изображения будут встроены в пост, остальные файлы - для скачивания</small>
    </div>
    
    <button type="submit" class="btn btn-primary btn-lg">{{ t('submit') }}</button>
    <a href="{{ url_for('index') }}" class="btn btn-outline">Отмена</a>
</form>
{% endblock %}
